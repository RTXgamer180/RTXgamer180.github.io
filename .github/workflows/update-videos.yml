name: Update JJ PLAYZ Videos

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp

      - name: Get YouTube videos
        run: |

          python - <<'PY'

          import json
          import subprocess
          import datetime

          CHANNEL = "https://www.youtube.com/@xxx-jj_playz/videos"

          command = [
              "yt-dlp",
              "--flat-playlist",
              "--playlist-end",
              "24",
              "--print",
              "%(id)s\t%(title)s\t%(upload_date)s",
              CHANNEL
          ]

          result = subprocess.run(
              command,
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              print(result.stderr)
              raise SystemExit(1)

          videos = []

          for line in result.stdout.splitlines():

              parts = line.split("\t", 2)

              if len(parts) != 3:
                  continue

              video_id, title, upload_date = parts

              if len(upload_date) == 8:

                  date = datetime.datetime.strptime(
                      upload_date,
                      "%Y%m%d"
                  ).strftime("%B %d, %Y")

              else:
                  date = "Recently uploaded"

              videos.append({
                  "id": video_id,
                  "title": title,
                  "date": date,
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
              })

          with open(
              "videos.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  videos,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          print(f"Found {len(videos)} videos.")

          PY

      - name: Save updated video list
        run: |

          git config user.name "JJ PLAYZ Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          git diff --cached --quiet || git commit -m "Update YouTube videos"

          git push
